  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: #142a3d;
      color: #ffffff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .intro-inner { width: 100%; max-width: 92vw; }
    .intro-title {
      margin: 0 auto;
      text-align: left;
      font-size: clamp(2rem, 7vw, 3.8rem);
      font-weight: 800;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      width: 0;
      border-right: 3px solid #8fc3dc;
      animation-name: intro-type, intro-caret;
      animation-duration: 1.9s, .7s;
      animation-timing-function: steps(21, end), step-end;
      animation-delay: .3s, .3s;
      animation-fill-mode: forwards, none;
      animation-iteration-count: 1, infinite;
    }
    .intro-sub {
      margin: 14px auto 0;
      text-align: left;
      font-size: clamp(1rem, 3.5vw, 1.4rem);
      color: #8fc3dc;
      white-space: nowrap;
      overflow: hidden;
      width: 0;
      opacity: 0;
      border-right: 2px solid #8fc3dc;
      animation-name: intro-type-sub, intro-caret, intro-show;
      animation-duration: 1.5s, .7s, .1s;
      animation-timing-function: steps(25, end), step-end, linear;
      animation-delay: 2.4s, 2.4s, 2.4s;
      animation-fill-mode: forwards, none, forwards;
      animation-iteration-count: 1, infinite, 1;
    }
    .intro-enter {
      display: inline-block;
      margin-top: 32px;
      border: 1px solid #8fc3dc;
      color: #8fc3dc;
      background: transparent;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 15px;
      text-decoration: none;
      cursor: pointer;
      opacity: 1;
      animation-name: intro-show;
      animation-duration: .3s;
      animation-delay: 4.2s;
      animation-fill-mode: both;
    }
    .intro-enter:hover { background: #203d55; color: #ffffff; }
    @keyframes intro-type { from { width: 0; } to { width: 23ch; } }
    @keyframes intro-type-sub { from { width: 0; } to { width: 27ch; } }
    @keyframes intro-caret { 0%, 100% { border-right-color: #8fc3dc; } 50% { border-right-color: transparent; } }
    @keyframes intro-show { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .intro-title, .intro-sub { animation: none; width: auto; opacity: 1; border-right: 0; white-space: normal; text-align: center; }
      .intro-enter { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="intro-inner">
    <p class="intro-title">Kevin Duy's Portfolio</p>
    <p class="intro-sub">Yes - I made this with AI</p>
    <a class="intro-enter" href="portfolio.html">Enter portfolio &rarr;</a>
  </div>
</body>
</html>
